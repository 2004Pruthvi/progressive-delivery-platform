apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: release-demo-ingress
  namespace: progressive-delivery
  annotations:
    kubernetes.io/ingress.class: nginx
    nginx.ingress.kubernetes.io/ssl-redirect: "false"
spec:
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: release-demo-stable
                port:
                  number: 80
