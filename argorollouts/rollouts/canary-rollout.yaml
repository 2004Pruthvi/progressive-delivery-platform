apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: release-demo-canary
  namespace: progressive-delivery
  labels:
    app.kubernetes.io/name: release-demo-app
    strategy: canary
spec:
  replicas: 4
  revisionHistoryLimit: 5
  selector:
    matchLabels:
      app.kubernetes.io/name: release-demo-app
  strategy:
    canary:
      # NGINX Ingress integration enables fine-grained weighted traffic splitting
      trafficRouting:
        nginx:
          stableIngress: release-demo-ingress
      canaryService: release-demo-canary
      stableService: release-demo-stable
      steps:
        # Step 1: Shift 10% traffic to canary and observe
        - setWeight: 10
        - pause: { duration: 30s }
        # Step 2: Automated Prometheus analysis verification
        - analysis:
            templates:
              - templateName: prometheus-rate-and-latency
        # Step 3: Shift 25% traffic
        - setWeight: 25
        - pause: { duration: 30s }
        - analysis:
            templates:
              - templateName: prometheus-rate-and-latency
        # Step 4: Shift 50% traffic
        - setWeight: 50
        - pause: { duration: 30s }
        # Step 5: Full promotion
        - setWeight: 100
  template:
    metadata:
      labels:
        app.kubernetes.io/name: release-demo-app
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8000"
        prometheus.io/path: "/metrics"
    spec:
      serviceAccountName: release-demo-sa
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
      containers:
        - name: release-demo-app
          image: release-demo-app:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
              protocol: TCP
          env:
            - name: APP_ENV
              value: "production"
            - name: SIMULATION_ENABLED
              value: "true"
            - name: SIMULATION_AUTH_TOKEN
              value: "devops-testing-secret-token"
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "300m"
              memory: "256Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /ready
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 2
            failureThreshold: 2
