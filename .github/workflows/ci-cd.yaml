name: "CI/CD: Build, Test, Security & Progressive Release"

on:
  push:
    branches: [ main ]
    tags: [ 'v*.*.*' ]
  pull_request:
    branches: [ main ]

permissions:
  id-token: write   # Required for AWS OIDC authentication
  contents: read    # Required for actions/checkout
  security-events: write # Required for uploading Trivy SARIF reports

jobs:
  # ===========================================================================
  # Job 1: Lint, Format, and Unit Tests
  # ===========================================================================
  test-and-lint:
    name: "Code Quality & Tests"
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r app/requirements.txt
          pip install -r app/requirements-dev.txt

      - name: Run Linting Checks (flake8 & black)
        run: |
          flake8 app tests --max-line-length=120 --exclude=__pycache__
          black --check app tests

      - name: Execute Unit & Integration Tests
        run: |
          pytest tests/ -v --cov=app --cov-report=term --cov-report=xml:coverage.xml

  # ===========================================================================
  # Job 2: Security & Vulnerability Scan
  # ===========================================================================
  security-scan:
    name: "Security Auditing"
    runs-on: ubuntu-latest
    needs: test-and-lint

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Run Trivy Vulnerability Scanner on Filesystem
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: 'fs'
          ignore-unfixed: true
          format: 'table'
          severity: 'CRITICAL,HIGH'

  # ===========================================================================
  # Job 3: Build Container & Publish to ECR
  # ===========================================================================
  build-and-publish:
    name: "Container Build & ECR Publish"
    runs-on: ubuntu-latest
    needs: [test-and-lint, security-scan]
    if: github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v')

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Determine Image Tags
        id: meta
        run: |
          SHORT_SHA=$(git rev-parse --short HEAD)
          VERSION="v1.0.0"
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/}"
          fi
          echo "short_sha=${SHORT_SHA}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Container Image Locally
        run: |
          docker build \
            -f docker/Dockerfile \
            --build-arg APP_VERSION="${{ steps.meta.outputs.version }}" \
            --build-arg COMMIT_SHA="${{ steps.meta.outputs.short_sha }}" \
            -t release-demo-app:${{ steps.meta.outputs.short_sha }} \
            -t release-demo-app:${{ steps.meta.outputs.version }} \
            .

      - name: Scan Built Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'release-demo-app:${{ steps.meta.outputs.short_sha }}'
          format: 'table'
          severity: 'CRITICAL,HIGH'
          exit-code: '0'

      # AWS ECR Push (using GitHub OIDC for secure, credential-less auth)
      - name: Configure AWS Credentials (OIDC)
        if: env.AWS_ROLE_ARN != ''
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION || 'us-east-1' }}

      - name: Login to Amazon ECR
        if: env.AWS_ROLE_ARN != ''
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Push Container to Amazon ECR
        if: env.AWS_ROLE_ARN != ''
        env:
          ECR_REGISTRY: ${{ steps.login-ecr.outputs.registry }}
          ECR_REPOSITORY: progressive-delivery/release-demo-app
          IMAGE_TAG: ${{ steps.meta.outputs.short_sha }}
        run: |
          docker tag release-demo-app:${IMAGE_TAG} ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          docker tag release-demo-app:${IMAGE_TAG} ${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ steps.meta.outputs.version }}
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
          docker push ${ECR_REGISTRY}/${ECR_REPOSITORY}:${{ steps.meta.outputs.version }}

      - name: Publish Release Summary
        run: |
          echo "### 🚀 Release Build Summary" >> $GITHUB_STEP_SUMMARY
          echo "- **App Version:** \`${{ steps.meta.outputs.version }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Commit SHA:** \`${{ steps.meta.outputs.short_sha }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** Container built, verified, and tagged successfully." >> $GITHUB_STEP_SUMMARY
